apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    app: crbcn-go-api
  name: crbcn-go-deployment
  namespace: data-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crbcn-go-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: crbcn-go-api
    spec:
      containers:
        - name: crbcn-go-api
          image: docker.tech.beegroup-cimne.com/crbcn_api/go-api:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: crbcn-api-secret
              mountPath: ".env"
              subPath: ".env"
      imagePullSecrets:
        - name: registrypullsecret
      volumes:
        - name: crbcn-api-secret
          secret:
            secretName: crbcn-api-secret
            items:
              - key: ".env"
                path: ".env"
