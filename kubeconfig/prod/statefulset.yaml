apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations: {}
  labels:
    app: crbcn-go-api
  name: crbcn-go-deployment
  namespace: crbcn
spec:
  serviceName: crbcn-go-api-headless
  replicas: 2
  selector:
    matchLabels:
      app: crbcn-go-api
  template:
    metadata:
      labels:
        app: crbcn-go-api
    spec:
      containers:
        - name: crbcn-go-api
          image: 853583158095.dkr.ecr.eu-west-1.amazonaws.com/ecr-crbcn-api:prod
          ports:
            - containerPort: 8090
          resources:
            limits:
              cpu: 400m
              memory: 2Gi
            requests:
              cpu: 50m
              memory: 256Mi
          volumeMounts:
            - name: crbcn-api-secret
              mountPath: ".env"
              subPath: ".env"
      volumes:
        - name: crbcn-api-secret
          secret:
            secretName: crbcn-api-secret
            items:
              - key: ".env"
                path: ".env"
#kubectl create secret generic crbcn-api-secret --from-file=.env=.env -n crbcn