apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations: {}
  labels:
    app: crbcn-go-api
  name: crbcn-go-deployment
  namespace: crbcn
spec:
  serviceName: crbcn-go-api-headless
  replicas: 2
  selector:
    matchLabels:
      app: crbcn-go-api
  template:
    metadata:
      labels:
        app: crbcn-go-api
    spec:
      containers:
        - name: crbcn-go-api
          image: 853583158095.dkr.ecr.eu-west-1.amazonaws.com/ecr-crbcn-api:prod
          ports:
            - containerPort: 8090
          startupProbe: # dona temps a arrencar; mentre falla, les altres no s'executen
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 36   # fins a 3 min
          readinessProbe: # treu el pod del Service si falla (no el reinicia)
            httpGet: { path: /healthz, port: http }   # si només tens un endpoint, fes servir /healthz sino /ready
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe: # reinicia el contenidor si falla; superficial, sense BD ni Kafka
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            limits:
              cpu: 400m
              memory: 2Gi
            requests:
              cpu: 50m
              memory: 256Mi
          volumeMounts:
            - name: crbcn-api-secret
              mountPath: ".env"
              subPath: ".env"
      volumes:
        - name: crbcn-api-secret
          secret:
            secretName: crbcn-api-secret
            items:
              - key: ".env"
                path: ".env"
#kubectl create secret generic crbcn-api-secret --from-file=.env=.env -n crbcn